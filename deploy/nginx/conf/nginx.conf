worker_processes auto;
pid /data/nginx/run/nginx.pid;
error_log /data/nginx/logs/error.log notice;

events {
    worker_connections 1024;
}

http {
    log_format aipc_sanitized '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent"';
    access_log /data/nginx/logs/access.log aipc_sanitized;
    client_body_temp_path /data/nginx/tmp/client_body;
    proxy_temp_path /data/nginx/tmp/proxy;
    fastcgi_temp_path /data/nginx/tmp/fastcgi;
    uwsgi_temp_path /data/nginx/tmp/uwsgi;
    scgi_temp_path /data/nginx/tmp/scgi;
    client_max_body_size 1024m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_referer $aipc_app_referer_upstream {
        default http://127.0.0.1:8080;
        include /data/nginx/conf/app-root-upstreams.conf;
    }

    map $http_referer $aipc_app_referer_prefix {
        default "";
        include /data/nginx/conf/app-root-prefixes.conf;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /data/aipc/etc/ssl/server.crt;
        ssl_certificate_key /data/aipc/etc/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /api/v1/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }

        location ^~ /api/ {
            proxy_pass $aipc_app_referer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix $aipc_app_referer_prefix;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        include /data/nginx/conf/app-routes.conf;

        location / {
            proxy_pass $aipc_app_referer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix $aipc_app_referer_prefix;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
