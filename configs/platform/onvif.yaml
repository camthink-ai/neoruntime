# ONVIF Device Service configuration.
#
# onvif-device exposes the NE503 AIPC as an ONVIF Profile S network camera so
# that third-party NVR/VMS software (Milestone, Blue Iris, Hikvision/Dahua NVRs,
# iVMS, Shinobi, ONVIF Device Manager) can discover it on the LAN and pull its
# RTSP stream with no vendor-specific integration.
#
# Deployed to /data/aipc/etc/onvif.yaml. Every field has a built-in default, so
# the service runs correctly even before this file exists on a fresh device.

service:
  enabled: true              # set false to disable the service without uninstalling
  http_port: 8081            # SOAP Device/Media service port
  base_path: /onvif          # service paths: /onvif/device_service, /onvif/media_service
  log_level: info

network:
  interface: eth0            # LAN interface for WS-Discovery multicast + IP discovery
  multicast_addr: 239.255.255.250  # WS-Discovery multicast group (standard, fixed)
  multicast_port: 3702       # WS-Discovery port (standard, fixed). Distinct from CT-Disc's 19850.

device:
  manufacturer: CamThink
  model: NE503
  hardware_id: NE503
  # Leave blank to derive from the device:
  #   serial_number: factory EEPROM -> VERSION "serial=" -> hostname
  #   firmware_version: VERSION "version="
  serial_number: ""
  firmware_version: ""
  scopes:
    - onvif://www.onvif.org/Profile/Streaming   # ONVIF Profile S (mandatory for NVR ingestion)
    - onvif://www.onvif.org/Profile/T
    - onvif://www.onvif.org/name/CamThink/NE503

rtsp:
  port: 8554                 # camera-daemon RTSP server port (see media-streaming.md)

# ONVIF media profiles, each mapped to a camera-daemon RTSP stream. The
# advertised stream URI is rtsp://<device-ip>:<rtsp.port>/<stream>.
profiles:
  - token: main              # profile token used by GetStreamUri / GetProfiles
    name: Main Stream
    stream: main             # RTSP path component
    width: 1920
    height: 1080
    fps: 30
    codec: H264              # H264 | H265 (H264 is the safest for Profile S interop)
    bitrate: 4096            # kbps
  - token: sub
    name: Sub Stream
    stream: sub
    width: 1280
    height: 720
    fps: 30
    codec: H264
    bitrate: 2048

auth:
  # WS-Security UsernameToken enforcement. The SOAP layer enforces digest auth
  # only when BOTH username and password are set.
  #   none   - no auth (best NVR onboarding interop; LAN trust boundary)
  #   digest - WS-Security digest; reuses AIPC_AUTH_USERNAME / AIPC_AUTH_PASSWORD
  mode: none
  username: ""               # used only when mode: digest and env vars are unset
  password: ""

version_file: ""             # default /data/aipc/VERSION
