# camera-daemon configuration (Hailo-15)
# Usage: camera-daemon -c /data/aipc/etc/camera-daemon.yaml
#
# Note: The 'streams' section has been removed — it was redundant with 'encoders'.
# In FROM_MEDIA mode, video contexts are auto-discovered from the pipeline.
# In standalone mode, camera-daemon derives stream configs from 'encoders'.

hal:
  video_library: /data/aipc/lib/hal/libaipc_hal.so
  codec_library: /data/aipc/lib/hal/libaipc_hal.so
  lens_library: /data/aipc/lib/hal/libhal-lens-bridge.so
  # led_library: optional, monolithic libaipc_hal.so includes HAL_LED_OPS
  # overlay_library: same libaipc_hal.so (monolithic, auto-detected)

# Media pipeline configuration (Hailo15 v2: required for FROM_MEDIA mode)
media:
  # Product-owned profile list adds Infrared_Basic while retaining vendor IQ paths.
  config_path: /data/aipc/etc/imaging/hailo15h/imx678/theia_sl410m/4k/medialib_configs/webserver_medialib_config.json
  backup_path: /data/aipc/data/media-backup

video:
  device_path: /dev/video0

watchdog:
  scan_interval_ms: 100
  frame_timeout_ms: 5000
  warn_threshold_ms: 3000

rtsp:
  enabled: true

audio:
  enabled: true
  capture_device: "default"
  sample_rate: 48000
  channels: 1
  codec: pcm
  bitrate: 128000
  volume: 1.0
  mute: false
  # audio_library: optional, monolithic libaipc_hal.so includes HAL_AUDIO_OPS

# Lens geometry overrides. The lens model itself comes from the factory
# EEPROM HWREV field (factory-station burned; af0832 when unprogrammed) —
# product.yaml no longer selects the lens. These fg2009 offsets are
# bench-calibrated bootstrap values — production units may deviate,
# retune here rather than in code.
lens:
  # Archive the last user-settled zoom/focus (event-driven: written only after
  # the motors settle and the position changed) and restore it at boot,
  # followed by one autofocus pass. Delete /data/aipc/etc/lens_position.json
  # to fall back to the config-derived startup position.
  # NOTE: this key must stay above the fg2009: subsection — the line-based
  # parser routes everything after fg2009: into that subsection.
  position_persistence: true
  fg2009:
    ram_steps: 2500         # overshoot that rams the TELE/FAR hard stops
    park_zoom_steps: 2400   # physical steps back from the TELE stop
    park_focus_steps: 2164  # physical steps back from the FAR stop
    zoom_pps: 600
    focus_pps: 600
    # Focus-tracking curve (INF): on every zoom move, focus follows this
    # (zoom_step, focus_step) table via a single DUAL_REL. Leave empty to
    # use /data/aipc/etc/focus_curve_fg2009.csv. Vendor values are
    # reference-only; recalibrate per lot by editing the CSV, not the code.
    focus_curve_path: /data/aipc/etc/focus_curve_fg2009.csv

autofocus:
  enabled: true
  startup_af: true
  stream_name: main
  # AF statistics come from the 4K native sensor, so the window percentages in
  # AF_demo/core must be scaled against 3840x2160 — not the main stream output.
  # Without these keys the controller falls back to the main stream resolution
  # and the windows shrink to 1080p proportions.
  sensor_native_width: 3840
  sensor_native_height: 2160
  # Empty means use the measured fixed compensation compiled into AF_demo/core.
  calibration_path: ""
  # Seed startup AF from the AF0832 optical table instead of linearly mapping
  # focus distance across the complete motor range.
  startup_zoom_ratio: 1.0
  startup_focus_distance_m: 3.0
  startup_wait_frames: 15
  # One Balanced retry around the first candidate when startup Fast AF is weak.
  startup_recovery_span: 320
  startup_ready_timeout_ms: 120000
  frame_wait_timeout_ms: 900
  move_timeout_ms: 10000
  pps: 1600
  # MCU V0.1.7: start zoom/focus on the same VD_FZ edge for every path segment.
  follow_sync_motion: true
  follow_sync_fallback_sequential: true
  follow_sync_zoom_max_pps: 1600
  follow_sync_focus_max_pps: 1600
  follow_sync_min_pps: 1600
  follow_sync_zoom_tolerance: 4
  follow_sync_focus_tolerance: 4
  # Keep the mid/tele path constraints continuous across the 2.25x boundary.
  follow_path_zoom_step_wide: 240
  follow_path_zoom_step_mid: 160
  follow_path_zoom_step_tele: 160
  follow_path_focus_step_wide: 24
  follow_path_focus_step_mid: 50
  follow_path_focus_step_tele: 50
  # Split a synchronized segment if its linear focus path departs too far
  # from the compensated zoom-focus reference curve.
  follow_curve_error_enable: true
  follow_curve_error_wide: 16
  follow_curve_error_mid: 8
  follow_curve_error_tele: 8
  min_focus_pos: -844
  max_focus_pos: 592
  coarse_step: 40
  coarse_span: 160
  fine_step: 8
  fine_span: 24
  max_moves: 200
  balanced_retry: 1
  confidence_accept: 0.80
  confidence_recovery: 0.65

infrared:
  enabled: true
  # Per-lens IR entry in the shared media config: af0832 keeps this name;
  # fg2009 auto-substitutes "Infrared_Basic_FG2009" at startup. An explicit
  # NON-default value is respected for bench tuning — but note "Infrared_Basic"
  # IS the default, so on fg2009 hardware writing it here cannot pin the
  # af0832 entry; A/B cross-lens IQ via a differently-named profile entry.
  # On fg2009 the substitution only fires when a media config actually
  # provides the entry (upgraded units with old imaging trees keep the
  # shared entry, logging a warning).
  profile_name: Infrared_Basic
  default_mode: day
  near_led_id: 0
  far_led_id: 1
  auto_follow: true
  lut_path: /data/aipc/etc/ir_zoom_lut.csv
  deadband_percent: 2
  endpoint_settle_frames: 3
  mode_settle_frames: 10
  log_updates: true

light_sensor:
  enabled: true
  auto_on_boot: false        # start in auto mode on boot (else default_mode from infrared)
  night_enter: 25            # light_percent <= night_enter => switch to night (25% ≈ 11.68 lux, bench)
  day_enter: 80              # light_percent >= day_enter   => switch to day (80% ≈ 25.36 lux, bench)
  sample_interval_ms: 500    # photodiode sampling cadence
  stable_samples: 3          # consecutive qualifying reads before a switch
  min_hold_s: 15             # anti-flap dwell: after an applied switch, hold this long before allowing another
  dark_mv: 4                 # measured dark-environment endpoint (calibration)
  bright_mv: 1909            # measured bright-environment endpoint (calibration)

ai_overlay:
  enabled: true
  event_bus_endpoint: "unix:///run/aipc/event-bus.sock"
  topic_prefix: "inference/"
  draw_labels: true
  draw_confidence: true
  draw_landmarks: true
  enable_face_blur: false
  box_thickness: 2
  # Stream mapping: inference_stream_id → display_encoder_stream
  stream_map: "third:main,sub:main"

# Encoders is the single source of truth for all stream configurations.
# 'enabled' controls whether the stream is active in the pipeline (persisted across restarts).
# main stream cannot be disabled.
# Use POST /api/v1/media/streams/:name/enable and DELETE /api/v1/media/streams/:name/disable
# to enable/disable sub and third streams at runtime (triggers ReconfigurePipeline).
encoders:
  - stream_name: main
    codec: h264
    width: 1920
    height: 1080
    fps: 30
    bitrate: 4000000
    gop: 30
    enabled: true
  - stream_name: sub
    codec: h264
    width: 1280
    height: 720
    fps: 30
    bitrate: 2000000
    gop: 60
    enabled: true
  - stream_name: third
    codec: h264
    width: 640
    height: 384
    fps: 15
    bitrate: 512000
    gop: 30
    enabled: true

service:
  log_level: debug
  log_file: /var/log/aipc/camera-daemon.log
