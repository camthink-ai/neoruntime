# ============================================================================
# AIPC Platform — kernel watchdog & panic self-healing
# ============================================================================
# Purpose: turn a full-system hang (the 93.72 failure mode — SSH/network dead,
# device never recovers) into "hang -> kernel panic -> automatic reboot", and
# capture a crash dump on persistent storage so the post-mortem is readable
# after the reboot.
#
# Without this file the device hangs forever on a kernel-level stall because
# no panic/hung-task policy is set by the BSP.
#
# Applied on device by:
#   - systemd-sysctl.service at boot (reads /etc/sysctl.d/*.conf)
#   - aipc-firstboot.sh on every boot (re-applies via `sysctl -p`, idempotent,
#     defends against BSP overrides)
#
# This file is the single source of truth; firstboot writes a copy to
# /etc/sysctl.d/99-aipc-watchdog.conf on the device.
# ============================================================================

# --- Panic self-healing ---------------------------------------------------
# Reboot 10s after a kernel panic instead of hanging forever.
kernel.panic = 10
kernel.panic_on_oops = 1

# --- Kernel stall detection (CONFIG-limited on Hailo15 BSP) ----------------
# NOTE: the hung_task / softlockup / watchdog sysctls are deliberately
# OMITTED. This Hailo15 BSP kernel is built WITHOUT CONFIG_DETECT_HUNG_TASK
# and WITHOUT CONFIG_SOFTLOCKUP_DETECTOR, so those nodes do not exist —
# including them only produces "No such file or directory" noise on every
# `sysctl -p`. D-state hangs and CPU soft-lockups are instead caught by the
# P1 hardware watchdog: systemd RuntimeWatchdog on sp805-wdt
# (configs/systemd/zz-aipc-watchdog.conf), which pets /dev/watchdog and
# hard-resets if systemd's main loop stalls. RCU stalls ARE detectable on
# this kernel, so keep that path armed too:
kernel.panic_on_rcu_stall = 1

# --- SysRq (magic SysRq for serial-console crash capture) -----------------
# Enable SysRq so an operator on the serial console can dump task stacks
# (Alt+SysRq+t), blocked D-state tasks (Alt+SysRq+w), and current CPU stack
# (Alt+SysRq+l) before forcing a safe reboot (Alt+SysRq+b) when the device
# is hung but the serial console is still alive.
kernel.sysrq = 1

# --- Coredump persistence -------------------------------------------------
# Write process core dumps to the persistent /data partition so a crashing
# service leaves a usable core for gdb post-mortem. Directory /data/core is
# created by aipc-firstboot.sh. systemd LimitCORE on each service enables the
# actual dump limit (infinity).
kernel.core_pattern = /data/core/core.%e.%p.%t
