# NE503 AI Runtime Configuration

# Service configuration
service:
  name: ai-runtime
  listen: unix:///run/aipc/ai-runtime.sock
  log_level: debug
  log_file: /var/log/aipc/ai-runtime.log

# HAL ML configuration
hal:
  library_path: /data/aipc/lib/hal/libaipc_hal.so
  # library_path: /data/aipc/lib/hal/libaipc_hal.so   # HAL v2 stub for host testing
  device_path: /dev/hailo0
  # NPU VDevice scheduling lives in the HAL, not here: libaipc_hal opens its
  # shared VDevice with group_id = the medialib's hailort.device-id
  # ("device0") + multi_process_service + ROUND_ROBIN
  # (hal_v2 kSharedVDeviceGroupId). Any other group makes hailort_server
  # refuse the attach while AI-ISP is active. The platform_config JSON that
  # used to sit here (scheduler.group_id "aipc" ...) was never parsed by the
  # HAL and has been removed; per-model backend_function is spliced by
  # ModelManager without needing a YAML skeleton.
# Model repository
models:
  repository_path: /data/aipc/models
  cache_path: /var/cache/aipc/models
  
  # Preload models — keep minimal to avoid NPU context exhaustion
  # Each loaded model (network group) consumes NPU resources that are never
  # released. Heavy models like vit_large (32 contexts, ~280MB) fail with
  # DEADLINE_EXCEEDED when too many models are preloaded.
  preload: []


# Inference scheduler configuration
scheduler:
  # Global quota
  global_qps_limit: 100
  global_concurrent_limit: 8
  
  # Default session quota
  default_session:
    max_qps: 30
    max_concurrent: 2
    priority: 5
  
  # Scheduler strategy
  strategy: fair  # priority | fifo | fair
  queue_size: 64
  timeout_ms: 5000

# FD Receiver (zero-copy DMA-BUF from camera-daemon)
fd_receiver:
  socket_path: /run/aipc/camera.sock
  # Test-only synthetic responses when camera frames are unavailable.
  simulation_enabled: false

# Admission limits for long-lived StreamInfer RPCs and their async work.
# Zero disables an individual limit; production defaults remain bounded.
stream_infer:
  max_active_rpcs: 16
  max_active_rpcs_per_peer: 16
  max_subscribers_per_stream: 4
  max_in_flight_total: 12
  max_in_flight_per_rpc: 3

# Stream DSP preprocess (opt-in): frames whose geometry doesn't match the model
# input are resized on the DSP into a private model-geometry dmabuf pool and
# fd-bound (zero CPU copies). Off or unavailable = direct DMA input; mismatched
# geometry is rejected by the existing HAL size validation.
stream_preprocess:
  enabled: false
  pool_slots: 4
  # Bound simultaneous model geometries so one client cannot reserve all
  # camera-daemon DSP buffers with idle mismatched streams.
  max_pools: 4
  job_timeout_ms: 100
  # camera-daemon CameraControl gRPC endpoint (SubmitDspJob job plane)
  job_endpoint: unix:///run/aipc/camera-control.sock

# Performance configuration
performance:
  # NPU performance mode
  device_mode: high  # high | normal | low
  
  # Batch processing
  batch_enabled: false
  batch_size: 1
  batch_timeout_ms: 100
  
  # Memory management
  max_model_cache: 3
  memory_limit_mb: 2048

# Monitoring and statistics
monitoring:
  enabled: true
  stats_interval_sec: 10
  metrics_port: 9090
  
  # Temperature protection
  temperature_limit_c: 85
  throttle_temperature_c: 80

# Event Bus integration
event_bus:
  enabled: true
  endpoint: "unix:///run/aipc/event-bus.sock"
  
  # Auto-publish inference results
  auto_publish_results: true
  result_topic_prefix: "inference/"

# Auto-inference (no external client needed)
auto_infer:
  enabled: false
