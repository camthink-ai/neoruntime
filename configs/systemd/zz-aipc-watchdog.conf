# ============================================================================
# AIPC Platform — systemd hardware-watchdog self-heal (sp805-wdt)
# ============================================================================
# The Hailo15 BSP registers sp805-wdt (/dev/watchdog0, amba 0x7c2c1000) but
# never arms it, so a full kernel-level hang — the 93.72 failure mode where
# SSH/network die and the device never recovers — has no last-resort reset.
# This drop-in makes systemd (PID 1) own the watchdog:
#
#   systemd pets /dev/watchdog every (actual_timeout / 2). If systemd's main
#   loop stops running (full hang), the pet stops and sp805 fires a HARD reset
#   after the timeout. That recovers the device from hangs the kernel sysctl
#   layer cannot: this BSP kernel is built WITHOUT CONFIG_DETECT_HUNG_TASK and
#   WITHOUT CONFIG_SOFTLOCKUP_DETECTOR, so kernel.hung_task_panic /
#   softlockup_panic would do nothing even if set. sp805 is the one self-heal
#   mechanism that actually works on this board.
#
# Value choice — sp805 advertises only KEEPALIVEPING, not WDIOF_SETTIMEOUT
# (mainline sp805 quirk: the .set_timeout ioctl exists but isn't flagged). So
# RuntimeWatchdogSec=20s MAY be ignored by the hardware; systemd then reads
# back the native timeout (10s) and pets every 5s. Either way systemd pets at
# HALF the actual timeout, so there is no false-reset risk from a SETTIMEOUT
# mismatch — systemd adapts. 20s keeps the reset window generous when the
# timeout IS honored.
#
# Activation: systemd reads system.conf.d at PID 1 start, so this takes effect
# on the next boot. To hot-activate a running device: `systemctl daemon-reexec`
# (systemd serializes the watchdog fd across reexec — no pet gap).
#
# Location on device: /etc/systemd/system.conf.d/zz-aipc-watchdog.conf
# ============================================================================

[Manager]
# Pet the hardware watchdog; hard-reset if systemd's main loop stalls.
RuntimeWatchdogSec=20s
# During reboot/shutdown systemd stops petting — give the reboot path a wide
# margin so the device is not reset mid-reboot.
RebootWatchdogSec=10min
