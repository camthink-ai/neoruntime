# ============================================================================
# AIPC Platform — journald persistent-storage override (HIGHEST priority)
# ============================================================================
# This drop-in is named "zz-" so it loads LAST in lexical order and beats
# every other journald.conf.d file — including BSP drop-ins such as
# journald-err-level.conf that force Storage=volatile. Without it the BSP's
# volatile setting wins (verified on Hailo15 ne503 BSP), so the journal never
# persists across reboots and a post-hang `journalctl -b -1` is empty.
#
# A lower-numbered drop-in like 90-*.conf CANNOT win here: the BSP file
# "journald-err-level.conf" sorts after any numeric prefix ('j' > '9'), so it
# always overrides. Only a "zz-" (or later) name is guaranteed to load last.
#
# Persistence additionally requires aipc-firstboot.sh to (a) bind-mount
# /data/journal onto /var/log/journal — the BSP puts /var on tmpfs — and
# (b) create /var/log/journal/<machine-id>/ and run `journalctl --flush` so
# journald migrates its runtime journal onto the persistent location. This
# file fixes only the Storage *policy*; the directory plumbing lives in
# firstboot Step 6.
#
# Location on device: /etc/systemd/journald.conf.d/zz-aipc-journal-persist.conf
# ============================================================================

[Journal]
# Force persistent storage. Loaded last so no BSP volatile override can win.
Storage=persistent

# Persistent (on-disk) journal quotas — bounded so the journal cannot fill /data.
SystemMaxUse=200M
SystemMaxFileSize=20M

# Retain on-disk journal for 7 days so hangs from earlier boots stay readable
# after the self-heal reboot.
MaxRetentionSec=7day
