# AIPC Platform — journald volatile caps + rate limiting
#
# This drop-in owns ONLY the volatile (/run) storage caps and the per-service
# rate limit. The persistent-storage POLICY (Storage=persistent), the on-disk
# quotas (SystemMaxUse / SystemMaxFileSize), and the retention window live in
# zz-aipc-journal-persist.conf, which is named "zz-" so it loads LAST in
# lexical order and wins over any BSP drop-in (e.g. journald-err-level.conf
# that forces Storage=volatile). Keeping Storage out of THIS file avoids a
# duplicate-key overlap and makes zz- the single source of truth.
#
# Volatile caps defend the tmpfs (/run) and the serial console: a chatty
# service can otherwise fill /run and spam the kernel console.
#
# Location on device: /etc/systemd/journald.conf.d/90-aipc-rate-limit.conf

[Journal]
# Volatile (/run) journal — tight caps to protect the tmpfs + serial console.
RuntimeMaxUse=8M
RuntimeMaxFileSize=2M

# Per-service rate limiting: a single unit flooding the journal is throttled.
RateLimitIntervalSec=10s
RateLimitBurst=200
