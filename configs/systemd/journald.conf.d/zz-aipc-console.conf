# AIPC boot services explicitly use StandardOutput=journal+console so their
# progress is visible on the serial debug console. The Hailo BSP ships
# journald-err-level.conf with MaxLevelConsole=err, which filters the normal
# info-level [aipc-boot] and [aipc-mcu-prep] messages even for those units.
#
# Keep ForwardToConsole disabled globally: this limit override permits info
# messages only when a unit explicitly requests console forwarding.

[Journal]
MaxLevelConsole=info
