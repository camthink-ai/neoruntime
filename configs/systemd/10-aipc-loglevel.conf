# AIPC Platform — systemd log level
#
# Override the systemd default log level to "info".
# Debug-level logging (the upstream default on some embedded BSPs)
# causes systemd to emit every D-Bus message to the journal,
# fills the journal, triggers frequent rotation and kernel console
# spam, and renders the serial console unusable.
#
# Location on device: /etc/systemd/system.conf.d/10-aipc-loglevel.conf

[Manager]
LogLevel=info
