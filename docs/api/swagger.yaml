  /monitor/gyro/attitude:
    get:
      tags:
      - Monitor
      summary: Stream gyroscope attitude (SSE)
      description: >-
        Server-Sent Events stream of device tilt (pitch/roll). `EventSource`
        cannot set custom headers, so authentication uses the `token` query
        parameter (raw value, no `Bearer ` prefix). The response sets
        `X-Accel-Buffering: no`. See `docs/references/gyro-attitude-sse.md` for the full
        client contract.
      operationId: streamGyroAttitude
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: Authentication token (raw value, no `Bearer ` prefix)
      - name: rate
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Output frequency cap (Hz), clamped to [1, 200]
      responses:
        '200':
          description: |-
            SSE event stream. Events:
            - `orientation` — data: `{"pitch": <deg>, "roll": <deg>}` — tilt only, yaw stripped; finite numbers in [-90, 90]
            - `status` — data: `{"sensor": "online" | "offline" | "error"}`
            - `error` — data: `{"code": "SENSOR_ERROR" | "SENSOR_UNAVAILABLE", "message": <text>}`
            - `heartbeat` — data: `{"timestamp": <ms>}` every 15s to keep proxies from closing the stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: orientation
                data: {"pitch":12.34,"roll":-5.67}

        '503':
          description: >-
            Gyro sensor source is disabled or not available (non-SSE JSON
            error); EventSource transitions to CLOSED and fires `onError`.
