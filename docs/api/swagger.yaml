        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Independent updater service started

  /system/os-upgrade/status:
    get:
      tags: [System]
      summary: Get the persistent OS upgrade status and log tail
      operationId: getOSUpgradeStatus
      parameters:
      - in: query
        name: job_id
        schema:
          type: string
      responses:
        '200':
          description: Current OS upgrade status

  /system/os-upgrade/reboot:
    post:
      tags: [System]
      summary: Reboot into the newly installed OS copy
      operationId: rebootOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Reboot service started

  /system/os-upgrade/cancel:
    post:
      tags: [System]
      summary: Cancel a job before installation
      operationId: cancelOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Job cancelled

  /system/os-upgrade/package:
    delete:
      tags: [System]
      summary: Delete a stored OS upgrade package
      operationId: deleteOSUpgradePackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Package deleted

  # ==================== System Time ====================
  /system/time:
    get:
      tags: [System]
      summary: Get current system time
      operationId: getSystemTime
      responses:
        '200':
          description: Current system time
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        timezone:
                          type: string
                        uptime:
                          type: integer
                          format: int64

  /system/time/set:
    post:
      tags: [System]
      summary: Set system time manually
      operationId: setSystemTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeRequest'
      responses:
        '200':
          description: Time set successfully

  /system/time/config:
    get:
      tags: [System]
      summary: Get time configuration (NTP settings)
      operationId: getTimeConfig
      responses:
        '200':
          description: Time configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TimeConfig'

  /system/time/timezone:
    put:
      tags: [System]
      summary: Set timezone
      operationId: setTimezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimezoneRequest'
      responses:
        '200':
          description: Timezone updated

  /system/time/ntp:
    put:
      tags: [System]
      summary: Configure NTP settings
      operationId: setNTPConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NTPConfigRequest'
      responses:
        '200':
          description: NTP configuration updated

  /system/time/ntp/sync:
    post:
      tags: [System]
      summary: Trigger NTP time synchronization
      operationId: syncNTP
      responses:
        '200':
          description: NTP sync triggered

  /system/time/timezones:
    get:
      tags: [System]
      summary: List available timezones
      operationId: getTimezones
      responses:
        '200':
          description: Timezone list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string

  # ==================== Event Logs ====================
  /event-logs:
    get:
      tags: [Event Logs]
      summary: List event logs
      description: Query event logs with filtering and pagination
      operationId: listEventLogs
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Event log entries
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        total:
                          type: integer
                          format: int64
                        limit:
                          type: integer
                        offset:
                          type: integer
                        entries:
                          type: array
                          items:
                            $ref: '#/components/schemas/EventLog'
    post:
      tags: [Event Logs]
      summary: Create an event log entry
      operationId: createEventLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventLogCreateRequest'
      responses:
        '200':
          description: Event log created
    delete:
      tags: [Event Logs]
      summary: Cleanup old event logs
      operationId: cleanupEventLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Number of days to retain
      responses:
        '200':
          description: Cleanup result

  /event-logs/statistics:
    get:
      tags: [Event Logs]
      summary: Get event log statistics
      operationId: getEventLogStatistics
      responses:
        '200':
          description: Event log statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true

  # ==================== Debug Logs ====================
  /debug-logs/export:
    post:
      tags: [Debug Logs]
      summary: Export debug logs as tar.gz
      operationId: exportDebugLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugLogExportRequest'
      responses:
        '200':
          description: tar.gz archive of debug logs
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /debug-logs/services:
    get:
      tags: [Debug Logs]
      summary: List available systemd services for log export
      operationId: getDebugLogServices
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string

  /debug-logs/files:
    get:
      tags: [Debug Logs]
      summary: List available log files
      operationId: getDebugLogFiles
      responses:
        '200':
          description: Log file list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                          name:
                            type: string
                          size:
                            type: integer
                            format: int64
                          modified_time:
                            type: string

  # ==================== App Manager Extended ====================
  /apps/{app_id}/restart:
    post:
      tags: [App Manager]
      summary: Restart an application
      operationId: restartApp
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # ==================== Network ====================
  /network/config:
    get:
      tags: [Network]
      summary: Get network configuration
      operationId: getNetworkConfig
      responses:
        '200':
          description: Network configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NetworkConfig'
    post:
      tags: [Network]
      summary: Update network configuration
      description: Switch between DHCP and static IP mode. Changing network config may cause temporary connectivity loss.
      operationId: updateNetworkConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
      responses:
        '200':
          description: Network configuration updated

  /network/interfaces:
    get:
      tags: [Network]
      summary: List all network interfaces
      operationId: getNetworkInterfaces
      responses:
        '200':
          description: Network interfaces
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        interfaces:
                          type: array
                          items:
                            $ref: '#/components/schemas/NetworkInterfaceInfo'

  # ==================== Device Info ====================
  /device-info:
    get:
      tags: [Device Info]
      summary: Get device information
      operationId: getDeviceInfo
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DeviceInfo'
    put:
      tags: [Device Info]
      summary: Update device name
      operationId: updateDeviceName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: Alphanumeric, underscore, hyphen only
      responses:
        '200':
          description: Device name updated

  # ==================== Media Extended ====================
  /media/image:
    put:
      tags: [Media]
      summary: Update ISP image parameters
      operationId: updateImageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaImageConfig'
      responses:
        '200':
          description: Image parameters updated

  /media/encoder:
    put:
      tags: [Media]
      summary: Update encoder parameters for a stream
      operationId: updateEncoderConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaEncoderConfig'
      responses:
        '200':
          description: Encoder parameters updated

  /media/rtsp:
    put:
      tags: [Media]
      summary: Enable or disable RTSP server
      operationId: setRtspEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: RTSP state updated

  /media/ai-overlay:
    put:
      tags: [Media]
      summary: Update AI overlay configuration
      operationId: updateAiOverlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAiOverlayConfig'
      responses:
        '200':
          description: AI overlay updated

  /media/osd:
    put:
      tags: [Media]
      summary: Update OSD (On-Screen Display) configuration
      operationId: updateOsdConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaOsdConfig'
      responses:
        '200':
          description: OSD configuration updated

  /media/encoder/reconfig:
    put:
      tags: [Media]
      summary: Reconfigure encoder (full reinit)
      description: Fully reconfigure encoder parameters. Causes brief stream interruption.
      operationId: reconfigureEncoder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaReconfigRequest'
      responses:
        '200':
          description: Encoder reconfigured
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        interrupt_ms:
                          type: integer

  # ==================== Files Extended ====================
  /files/batch-download:
    post:
      tags: [Files]
      summary: Batch download files as ZIP
      operationId: batchDownloadFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBatchRequest'
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /files/batch-delete:
    post:
      tags: [Files]
      summary: Batch delete files
      operationId: batchDeleteFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBatchRequest'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: array
                          items:
                            type: string
                        count:
                          type: integer
                        failed:
                          type: array
                          items:
                            type: object
                        failed_count:
                          type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
  schemas:
    APIResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: Success
        data:
          type: object
          description: Response payload
        error:
          $ref: '#/components/schemas/ErrorDetail'
    TensorSpec:
      type: object
      properties:
        name:
          type: string
        shape:
          type: array
          items:
            type: integer
        dtype:
          type: string
          enum:
          - UINT8
          - INT8
          - UINT16
          - INT16
          - FLOAT16
          - FLOAT32
          - INT32
          - UINT32
    ModelInfo:
      type: object
      properties:
        model_id:
          type: string
        model_path:
          type: string
        version:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TensorSpec'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/TensorSpec'
        estimated_tops:
          type: number
        estimated_memory:
          type: integer
        load_timestamp:
          type: integer
          format: int64
    ModelListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
    ModelRegisterResponse:
      type: object
      properties:
        model_id:
          type: string
        status:
          type: object
          description: Empty data
    InferenceStats:
      type: object
      properties:
        model_id:
          type: string
        total_inferences:
          type: integer
          format: int64
        total_errors:
          type: integer
          format: int64
        avg_latency_us:
          type: integer
          format: int64
        current_qps:
          type: number
        queue_depth:
          type: integer
    SystemStats:
      type: object
      properties:
        model_stats:
          type: array
          items:
            $ref: '#/components/schemas/InferenceStats'
        device_utilization:
          type: number
        device_temperature:
          type: number
        total_memory_bytes:
          type: integer
          format: int64
        used_memory_bytes:
          type: integer
          format: int64
    TopicInfo:
      type: object
      properties:
        name:
          type: string
        subscriber_count:
          type: integer
    DeviceStatus:
      type: object
      properties:
        white_light_level:
          type: integer
        ir_led_on:
          type: boolean
        ircut_mode:
          type: integer
        soc_temp_c:
          type: number
        mcu_temp_c:
          type: number
        light_sensor:
          type: integer
        ptz_pan_pos:
          type: number
        ptz_tilt_pos:
          type: number
        zoom_pos:
          type: integer
        focus_pos:
          type: integer
        autofocus_enabled:
          type: boolean
        mcu_version:
          type: string
        mcu_uptime_ms:
          type: integer
          format: int64
        gpio_states:
          type: object
          additionalProperties:
            type: boolean
    AppInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
          - unknown
          - installing
          - stopped
          - starting
          - running
          - stopping
          - error
        image:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/AppStats'
    AppStats:
      type: object
      properties:
        cpu_usage_percent:
          type: number
        memory_usage_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_rx_bytes:
          type: integer
          format: int64
        network_tx_bytes:
          type: integer
          format: int64
        pids:
          type: integer
        uptime_seconds:
          type: integer
          format: int64
    AppPermissions:
      type: object
      properties:
        video:
          type: array
          items:
            type: string
          description: List of video streams the app can access
        inference:
          type: object
          properties:
            models:
              type: array
              items:
                type: string
              description: List of AI models the app can use
            max_qps:
              type: integer
              description: Maximum queries per second
            max_concurrent:
              type: integer
              description: Maximum concurrent inferences
            allow_register_model:
              type: boolean
              description: Whether app can register new models
        events:
          type: object
          properties:
            publish:
              type: array
              items:
                type: string
              description: List of event topics the app can publish to
            subscribe:
              type: array
              items:
                type: string
              description: List of event topics the app can subscribe to
        device:
          type: object
          properties:
            light:
              type: boolean
              description: Access to light control
            ir_cut:
              type: boolean
              description: Access to IR cut filter
            ptz:
              type: boolean
              description: Access to PTZ control
            lens:
              type: boolean
              description: Access to lens control
        network:
          type: object
          properties:
            mode:
              type: string
              description: Network mode (isolated, host, etc.)
            outbound:
              type: array
              items:
                type: string
              description: Allowed outbound connections
            inbound:
              type: array
              items:
                type: integer
              description: Allowed inbound ports
    AppListResponse:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppInfo'
    InstallResponse:
      type: object
      properties:
        status:
          type: object
          description: Empty data
        app_id:
          type: string
    StreamInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        fps:
          type: integer
        codec:
          type: string
        bitrate:
          type: integer
    StreamListResponse:
      type: object
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamInfo'

    ErrorDetail:
      type: object
      properties:
        type:
          type: string
        detail:
          type: string

    # ==================== Store Schemas ====================
