  # ==================== App Manager Extensions ====================
  /apps/wizard:
    post:
      tags: [App Manager]
      summary: Install app via wizard
      operationId: wizardInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, name, image]
              properties:
                app_id:
                  type: string
                name:
                  type: string
                image:
                  type: string
                config:
                  type: object
      responses:
        '200':
          description: App installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /apps/upload-image:
    post:
      tags: [App Manager]
      summary: Upload container image
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        image:
                          type: string
  /apps/upload-manifest:
    post:
      tags: [App Manager]
      summary: Upload app manifest
      description: Uploads a YAML app manifest (multipart field "file", .yaml/.yml only)
        for later package install.
      operationId: uploadManifest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: App manifest YAML
      responses:
        '200':
          description: Manifest uploaded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /apps/install-package:
    post:
      tags: [App Manager]
      summary: Install app from uploaded manifest and image
      description: Async install — returns a task_id whose progress is tracked via
        /apps/install-progress/{task_id}.
      operationId: installPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest_path]
              properties:
                manifest_path:
                  type: string
                  description: Server-side path of the manifest (from upload-manifest)
                image_path:
                  type: string
                  description: Optional server-side path of the container image
                force:
                  type: boolean
                  description: Reinstall if the app already exists
      responses:
        '200':
          description: Async install accepted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        task_id:
                          type: string
  /apps/install-progress/{task_id}:
    get:
      tags: [App Manager]
      summary: Get async install progress
      operationId: getInstallProgress
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Install progress
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        task_id:
                          type: string
                        phase:
                          type: string
                        percent:
                          type: integer
                        message:
                          type: string
                        app_id:
                          type: string
                        error:
                          type: string

  # ==================== Container Log / Exec WebSockets ====================
  /containers/{id}/logs/ws:
    get:
      tags: [App Manager]
      summary: Stream container logs in real-time over WebSocket
      operationId: streamContainerLogsWS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '400':
          description: Invalid request

  /containers/{id}/exec/ws:
    get:
      tags: [App Manager]
      summary: Interactive container console over WebSocket
      operationId: execContainerWS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cols
          in: query
          required: false
          schema:
            type: integer
            default: 80
        - name: rows
          in: query
          required: false
          schema:
            type: integer
            default: 24
        - name: command
          in: query
          required: false
          schema:
            type: string
            default: "/bin/sh"
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '400':
          description: Invalid request

  # ==================== Storage Management ====================
  /storage/disks:
    get:
      tags: [Storage]
      summary: List available disks and partitions
      operationId: listDisks
      responses:
        '200':
          description: List of block devices

  /storage/mount:
    post:
      tags: [Storage]
      summary: Mount a block device to a destination
      operationId: mountDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  type: string
                  example: /dev/sda1
                target:
                  type: string
                  example: /mnt/sda1
      responses:
        '200':
          description: Mount successful

  /storage/unmount:
    post:
      tags: [Storage]
      summary: Unmount a previously mounted disk
      operationId: unmountDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  example: /mnt/sda1
      responses:
        '200':
          description: Unmount successful

  /storage/format:
    post:
      tags: [Storage]
      summary: Format a disk with a specific filesystem
      operationId: formatDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  type: string
                  example: /dev/sda1
                fstype:
                  type: string
                  example: ext4
                  enum: [ext4, vfat, fat32]
      responses:
        '200':
          description: Format successful

  # ==================== Media Config ====================
  /media/config:
    get:
      tags: [Media]
      summary: Get the camera daemon's configuration
      operationId: getMediaConfig
      responses:
        '200':
          description: camera-daemon configuration
    post:
      tags: [Media]
      summary: Update the camera daemon's configuration and apply changes
      operationId: setMediaConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial configuration object overlay
      responses:
        '200':
          description: Configuration updated

  /media/config/field:
    get:
      tags: [Media]
      summary: Read one scalar media profile field
      operationId: getMediaConfigField
      parameters:
      - name: field_path
        in: query
        required: true
        schema:
          type: string
          example: frontend.hailort.use-hailort-service
      responses:
        '200':
          description: Current scalar field value
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        field_path:
                          type: string
                        type:
                          type: integer
                          description: ConfigFieldType enum value
                        type_name:
                          type: string
                        value:
                          type: string
    put:
      tags: [Media]
      summary: Update one allow-listed scalar media profile field
      operationId: setMediaConfigField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_path, type, value]
              properties:
                field_path:
                  type: string
                  example: frontend.hailort.use-hailort-service
                type:
                  type: integer
                  description: ConfigFieldType enum value (0=BOOL, 1=INT32, 2=UINT32, 3=FLOAT64, 4=STRING)
                  minimum: 0
                  maximum: 4
                value:
                  type: string
                  example: 'true'
      responses:
        '200':
          description: Config field applied

  /media/config/export:
    get:
      tags: [Media]
      summary: Export the unified media configuration envelope
      operationId: exportMediaConfig
      responses:
        '200':
          description: Versioned media configuration envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true

  /media/config/import:
    post:
      tags: [Media]
      summary: Import a unified media configuration envelope
      operationId: importMediaConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema, version, config]
              properties:
                schema:
                  type: string
                  enum: [aipc.media_config]
                version:
                  type: integer
                  enum: [1]
                config:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Configuration imported and camera-daemon restart requested

