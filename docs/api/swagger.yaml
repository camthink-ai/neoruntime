          example: "22"
        permit_root_login:
          type: string
          enum: [yes, "no", prohibit-password]
        password_authentication:
          type: string
          enum: [yes, "no"]
        pubkey_authentication:
          type: string
          enum: [yes, "no"]
        max_auth_tries:
          type: string
        restart_service:
          type: boolean

    OSUpgradeJobRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid

    OSUpgradeJob:
      type: object
      description: A/B OS upgrade job. App compatibility is advisory for OS
        upgrades — the install proceeds regardless and compatibility_valid /
        compatibility_warning record the verdict for the operator.
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [idle, uploading, validating, ready, installing, installed,
            awaiting_reboot, rebooting, verifying, success, rollback, failed,
            cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        error:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        sha256:
          type: string
        current_version:
          type: string
        target_version:
          type: string
        build_time:
          type: string
        machine:
          type: string
        product:
          type: string
        hardware_version:
          type: string
        current_copy:
          type: string
          description: Active OS copy (a or b)
        target_copy:
          type: string
        previous_copy:
          type: string
        upgrade_mode:
          type: string
        upgrade_strategy:
          type: string
          description: standard or full
        update_mode:
          type: string
        available_update_modes:
          type: array
          items:
            type: string
        available_update_mode_options:
          type: array
          items:
            $ref: '#/components/schemas/OSUpgradeModeOption'
        available_upgrade_strategies:
          type: array
          items:
            $ref: '#/components/schemas/OSUpgradeStrategyOption'
        supports_standard_upgrade:
          type: boolean
        supports_full_upgrade:
          type: boolean
        recovery_source:
          type: string
        recovery_version:
          type: string
        secure_boot_key_id:
          type: string
        app_version:
          type: string
          description: Version of the currently installed app package
        compatibility_valid:
          type: boolean
          description: Whether the installed app is expected to run on the
            target OS (advisory)
        compatibility_warning:
          type: string
        rollback_supported:
          type: boolean
        service_interruption_required:
          type: boolean
        downgrade_allowed:
          type: boolean
        signature_valid:
          type: boolean
        reboot_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        log:
          type: string
          description: Tail of the upgrade log (status endpoint only)

    OSUpgradeModeOption:
      type: object
      properties:
        mode:
          type: string
        supported:
          type: boolean
        default:
          type: boolean
        reason:
          type: string
        warning:
          type: string
        warning_code:
          type: string
        warning_copy:
          type: string
        warning_target:
          type: string

    OSUpgradeStrategyOption:
      type: object
      properties:
        strategy:
          type: string
        modes:
          type: array
          items:
            type: string
        supported:
          type: boolean
        reason:
          type: string

