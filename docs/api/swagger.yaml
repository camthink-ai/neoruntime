openapi: 3.0.3
info:
  title: AIPC Platform API
  description: 'AIPC Platform REST API for edge AI computing platform.


    Provides unified access to:

    - AI Runtime (model management, inference)

    - Event Bus (pub/sub messaging)

    - Device Control (camera, PTZ, GPIO)

    - App Manager (container lifecycle)

    - Stream (HLS video streaming)

    '
  version: 1.0.1
  contact:
    name: AIPC Platform Team
    email: support@camthink.ai
servers:
- url: /api/v1
  description: Current host (resolved against wherever this spec is served,
    e.g. http://<device>:8080/api/v1 — same-origin, no CORS)
- url: http://localhost:8080/api/v1
  description: Local development
- url: http://{host}:8080/api/v1
  description: Explicit host
  variables:
    host:
      default: localhost
security:
- BearerAuth: []
tags:
- name: System
  description: System information and health
- name: AI Runtime
  description: Model management and inference
- name: Event Bus
  description: Pub/sub event messaging
- name: Device Control
  description: Camera and device control
- name: App Manager
  description: Container application lifecycle
- name: Stream
  description: Video streaming
- name: Settings
  description: Dynamic system configuration (key-value store)
- name: Monitor
  description: System resource monitoring (CPU, memory, disk, network)
- name: Processes
  description: System process management
- name: Files
  description: Remote file management
- name: Terminal
  description: Web-based terminal access
- name: SSH
  description: SSH service configuration
- name: Logs
  description: System and service log viewing
- name: Storage
  description: Disk manipulation and hot-plug support
- name: Media
  description: Camera and media configuration
- name: Event Logs
  description: Event log management and querying
- name: Debug Logs
  description: Debug log export and service log access
- name: Network
  description: Network interface configuration (DHCP, static IP)
- name: Device Info
  description: Device information and naming
- name: Store
  description: Application store for discovering and installing apps
- name: Dev
  description: Application development workbench
- name: Containers
  description: Container management (containerd)
- name: Images
  description: Container image management
paths:
  /system/info:
    get:
      tags:
      - System
      summary: Get system information
      description: Returns platform version and service availability status
      operationId: getSystemInfo
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        version:
                          type: string
                          example: 0.1.0
                        services:
                          type: object
                          properties:
                            ai-runtime:
                              type: boolean
                            event-bus:
                              type: boolean
                            device-control:
                              type: boolean
                            app-manager:
                              type: boolean
  /system/stats:
    get:
      tags:
      - System
      summary: Get system statistics
      description: Returns real-time system and service statistics
      operationId: getSystemStats
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        timestamp:
                          type: integer
                          format: int64
                        services:
                          type: object
                          additionalProperties:
                            type: object
  /system/health:
    get:
      tags:
      - System
      summary: Health check
      description: Returns service health status (no authentication required)
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
                          example: healthy
                        time:
                          type: integer
                          format: int64
                        service:
                          type: string
                          example: platform-api
  /ai/capabilities:
    get:
      tags:
      - AI Runtime
      summary: Get supported model formats and types
      operationId: getAiCapabilities
      responses:
        '200':
          description: Supported formats and model types
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        formats:
                          type: array
                          items:
                            type: object
                        model_types:
                          type: array
                          items:
                            type: string
  /ai/models/parse:
    post:
      tags:
      - AI Runtime
      summary: Parse an uploaded model file
      description: Uploads a model file (multipart field "model") and returns parsed
        metadata (HEF network/input info) without loading it.
      operationId: parseModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - model
              properties:
                model:
                  type: string
                  format: binary
                  description: Model file (.hef, .onnx, ...)
      responses:
        '200':
          description: Parsed model metadata
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /ai/models/scan:
    post:
      tags:
      - AI Runtime
      summary: Rescan disk for model files
      description: Seeds/refreshes the model registry from on-disk model directories.
      operationId: scanModels
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /ai/models/{model_id}/load:
    post:
      tags:
      - AI Runtime
      summary: Load a model into the AI runtime
      operationId: loadModel
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Load result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /ai/models/{model_id}/unload:
    post:
      tags:
      - AI Runtime
      summary: Unload a model from the AI runtime
      operationId: unloadModel
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unload result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /ai/models:
    get:
      tags:
      - AI Runtime
      summary: List all registered models
      operationId: listModels
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelListResponse'
        '503':
          description: AI Runtime not available
    post:
      tags:
      - AI Runtime
      summary: Register a new model
      description: Register a model by specifying its file path
      operationId: registerModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model_path
              properties:
                model_path:
                  type: string
                  description: Absolute path to model file
                  example: /data/aipc/models/yolov8n.hef
                model_id:
                  type: string
                  description: Optional model identifier
                  example: yolo_detection_v1
      responses:
        '200':
          description: Model registered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelRegisterResponse'
        '400':
          description: Invalid request
        '503':
          description: AI Runtime not available
  /ai/models/upload:
    post:
      tags:
      - AI Runtime
      summary: Upload and register a model file
      description: Upload a model file (HEF, ONNX, TFLite) and register it
      operationId: uploadModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - model
              properties:
                model:
                  type: string
                  format: binary
                  description: Model file (.hef, .onnx, .bin, .tflite)
                model_id:
                  type: string
                  description: Optional model identifier
                model_type:
                  type: string
                  description: Optional model type (hef, onnx, tflite)
                variant:
                  type: string
                  description: Optional model variant
                threshold:
                  type: number
                  format: float
                  description: Optional detection threshold
                max_detections:
                  type: integer
                  description: Optional maximum detections
      responses:
        '200':
          description: Model uploaded and registered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        model_id:
                          type: string
                        model_path:
                          type: string
                        filename:
                          type: string
                        size:
                          type: integer
                        status:
                          type: object
                          description: Empty data
  /ai/models/{model_id}:
    get:
      tags:
      - AI Runtime
      summary: Get model information
      operationId: getModelInfo
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelInfo'
        '404':
          description: Model not found
    delete:
      tags:
      - AI Runtime
      summary: Unregister a model
      operationId: unregisterModel
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model unregistered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /ai/models/{model_id}/apps:
    get:
      tags:
      - AI Runtime
      summary: Get apps using a model
      description: Returns list of applications that are using this model
      operationId: getModelApps
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of apps using the model
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string
                      description: List of app IDs using this model
        '404':
          description: Model not found
  /ai/stats:
    get:
      tags:
      - AI Runtime
      summary: Get AI runtime statistics
      operationId: getAIStats
      responses:
        '200':
          description: AI statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SystemStats'
  /events/topics:
    get:
      tags:
      - Event Bus
      summary: List all event topics
      operationId: listTopics
      responses:
        '200':
          description: List of topics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        topics:
                          type: array
                          items:
                            $ref: '#/components/schemas/TopicInfo'
  /events/publish:
    post:
      tags:
      - Event Bus
      summary: Publish an event
      operationId: publishEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - topic
              properties:
                topic:
                  type: string
                  example: app/detection/result
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /events/stream:
    get:
      tags:
      - Event Bus
      summary: Subscribe to event stream (WebSocket)
      description: 'WebSocket endpoint for real-time event subscription.


        Connect with: `ws://{host}/api/v1/events/stream?token={jwt_token}`

        '
      operationId: eventStream
      responses:
        '101':
          description: Switching to WebSocket protocol
  /device/status:
    get:
      tags:
      - Device Control
      summary: Get device status
      operationId: getDeviceStatus
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DeviceStatus'
  /device/light:
    post:
      tags:
      - Device Control
      summary: Set white light level
      operationId: setLight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - level
              properties:
                level:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Light level (0-100)
      responses:
        '200':
          description: Light set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-led:
    post:
      tags:
      - Device Control
      summary: Control IR LED
      operationId: setIrLed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: boolean
                  description: Turn IR LED on/off
      responses:
        '200':
          description: IR LED set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-cut:
    post:
      tags:
      - Device Control
      summary: Set IR-CUT filter mode
      operationId: setIrCut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - auto
                  - day
                  - night
                  description: IR-CUT filter mode
      responses:
        '200':
          description: IR-CUT mode set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ptz:
    post:
      tags:
      - Device Control
      summary: Control PTZ (Pan/Tilt/Zoom)
      operationId: controlPTZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - pan
                  - tilt
                  - stop
                  - preset
                  - zoom
                  - focus
                direction:
                  type: string
                  enum:
                  - left
                  - right
                  - up
                  - down
                  - stop
                  description: Direction for pan/tilt
                speed:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Pan/tilt speed
                preset_id:
                  type: integer
                  minimum: 1
                  maximum: 255
                  description: Preset ID to call
                zoom_speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Zoom speed (negative=out, positive=in)
                focus_speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Focus speed (negative=near, positive=far)
      responses:
        '200':
          description: PTZ command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/zoom:
    post:
      tags:
      - Device Control
      summary: Control zoom
      operationId: controlZoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - speed
              properties:
                speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Zoom speed
      responses:
        '200':
          description: Zoom command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/focus:
    post:
      tags:
      - Device Control
      summary: Control focus
      operationId: controlFocus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - speed
              properties:
                speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Focus speed
      responses:
        '200':
          description: Focus command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/autofocus:
    post:
      tags:
      - Device Control
      summary: Enable/disable autofocus
      operationId: setAutofocus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enable
              properties:
                enable:
                  type: boolean
      responses:
        '200':
          description: Autofocus setting updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/gpio:
    get:
      tags:
      - Device Control
      summary: Batch read GPIO values
      description: Reads multiple GPIO pins in one call. Without the pins parameter
        returns the full pin catalog with live values.
      operationId: gpioBatchRead
      parameters:
      - name: pins
        in: query
        required: false
        description: Comma-separated pin names/numbers (max 64). Omit to read all.
        schema:
          type: string
      responses:
        '200':
          description: GPIO pin catalog with live values
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
    post:
      tags:
      - Device Control
      summary: Write GPIO value
      operationId: gpioWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pin
              - value
              properties:
                pin:
                  type: integer
                  description: GPIO pin number
                value:
                  type: boolean
                  description: Pin value (high/low)
      responses:
        '200':
          description: GPIO written
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/gpio/{pin}:
    get:
      tags:
      - Device Control
      summary: Read GPIO value
      operationId: gpioRead
      parameters:
      - name: pin
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: GPIO value
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        pin:
                          type: integer
                        value:
                          type: boolean
  /device/imaging-mode:
    put:
      tags:
      - Device Control
      summary: Set imaging mode (day/night)
      operationId: setImagingMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - day
                  - infrared
                  - auto
                  description: Imaging mode
      responses:
        '200':
          description: Imaging mode set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/infrared/status:
    get:
      tags:
      - Device Control
      summary: Get infrared status
      description: Returns current IR output state, day/night policy and light-sensor readings.
      operationId: getInfraredStatus
      responses:
        '200':
          description: Infrared status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/InfraredStatus'
  /device/infrared/settings:
    put:
      tags:
      - Device Control
      summary: Update infrared settings
      description: 'Partially updates IR policy: auto-follow, near/far PWM duty (0-100)
        and day/night light-sensor thresholds (night_enter must be less than day_enter).'
      operationId: setInfraredSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_follow:
                  type: boolean
                near_pwm:
                  type: integer
                  minimum: 0
                  maximum: 100
                far_pwm:
                  type: integer
                  minimum: 0
                  maximum: 100
                night_enter:
                  type: integer
                  minimum: 0
                  maximum: 100
                day_enter:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Infrared settings updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/InfraredStatus'
  /device/infrared/manual:
    delete:
      tags:
      - Device Control
      summary: Clear manual infrared override
      description: Returns IR control to the automatic day/night policy.
      operationId: clearInfraredManual
      responses:
        '200':
          description: Manual override cleared
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-presets:
    get:
      tags:
      - Device Control
      summary: List IR presets
      description: IR presets snapshot zoom ratio + near/far IR intensity for one-click recall.
      operationId: listIrPresets
      responses:
        '200':
          description: IR preset list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        success:
                          type: boolean
                        message:
                          type: string
                        presets:
                          type: array
                          items:
                            $ref: '#/components/schemas/IrPreset'
    put:
      tags:
      - Device Control
      summary: Save an IR preset
      operationId: saveIrPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                zoom_ratio:
                  type: number
                  minimum: 1.0
                  maximum: 2.88
                  description: Optical zoom ratio (1.0-2.88)
                near_pwm:
                  type: integer
                  minimum: 0
                  maximum: 100
                far_pwm:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: IR preset saved
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-presets/{name}:
