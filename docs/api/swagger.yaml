          required: true
          schema:
            type: string
        - name: cols
          in: query
          required: false
          schema:
            type: integer
            default: 80
        - name: rows
          in: query
          required: false
          schema:
            type: integer
            default: 24
        - name: command
          in: query
          required: false
          schema:
            type: string
            default: "/bin/sh"
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '400':
          description: Invalid request

  # ==================== Storage Management ====================
  /storage/disks:
    get:
      tags: [Storage]
      summary: List available disks and partitions
      operationId: listDisks
      responses:
        '200':
          description: List of block devices

  /storage/mount:
    post:
      tags: [Storage]
      summary: Mount a block device to a destination
      operationId: mountDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  type: string
                  example: /dev/sda1
                target:
                  type: string
                  example: /mnt/sda1
      responses:
        '200':
          description: Mount successful

  /storage/unmount:
    post:
      tags: [Storage]
      summary: Unmount a previously mounted disk
      operationId: unmountDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  example: /mnt/sda1
      responses:
        '200':
          description: Unmount successful

  /storage/format:
    post:
      tags: [Storage]
      summary: Format a disk with a specific filesystem
      operationId: formatDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  type: string
                  example: /dev/sda1
                fstype:
                  type: string
                  example: ext4
                  enum: [ext4, vfat, fat32]
      responses:
        '200':
          description: Format successful

  # ==================== Media Config ====================
  /media/config:
    get:
      tags: [Media]
      summary: Get the camera daemon's configuration
      operationId: getMediaConfig
      responses:
        '200':
          description: camera-daemon configuration
    post:
      tags: [Media]
      summary: Update the camera daemon's configuration and apply changes
      operationId: setMediaConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial configuration object overlay
      responses:
        '200':
          description: Configuration updated

  /media/config/field:
    get:
      tags: [Media]
      summary: Read one scalar media profile field
      operationId: getMediaConfigField
      parameters:
      - name: field_path
        in: query
        required: true
        schema:
          type: string
          example: frontend.hailort.use-hailort-service
      responses:
        '200':
          description: Current scalar field value
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        field_path:
                          type: string
                        type:
                          type: integer
                          description: ConfigFieldType enum value
                        type_name:
                          type: string
                        value:
                          type: string
    put:
      tags: [Media]
      summary: Update one allow-listed scalar media profile field
      operationId: setMediaConfigField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_path, type, value]
              properties:
                field_path:
                  type: string
                  example: frontend.hailort.use-hailort-service
                type:
                  type: integer
                  description: ConfigFieldType enum value (0=BOOL, 1=INT32, 2=UINT32, 3=FLOAT64, 4=STRING)
                  minimum: 0
                  maximum: 4
                value:
                  type: string
                  example: 'true'
      responses:
        '200':
          description: Config field applied

  /media/config/export:
    get:
      tags: [Media]
      summary: Export the unified media configuration envelope
      operationId: exportMediaConfig
      responses:
        '200':
          description: Versioned media configuration envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true

  /media/config/import:
    post:
      tags: [Media]
      summary: Import a unified media configuration envelope
      operationId: importMediaConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema, version, config]
              properties:
                schema:
                  type: string
                  enum: [aipc.media_config]
                version:
                  type: integer
                  enum: [1]
                config:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Configuration imported and camera-daemon restart requested

