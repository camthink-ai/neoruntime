openapi: 3.0.3
info:
  title: AIPC Platform API
  description: 'AIPC Platform REST API for edge AI computing platform.


    Provides unified access to:

    - AI Runtime (model management, inference)

    - Event Bus (pub/sub messaging)

    - Device Control (camera, PTZ, GPIO)

    - App Manager (container lifecycle)

    - Stream (HLS video streaming)

    '
  version: 1.0.0
  contact:
    name: AIPC Platform Team
    email: support@camthink.ai
servers:
- url: http://localhost:8080/api/v1
  description: Development server
- url: http://{host}:8080/api/v1
  description: Production server
  variables:
    host:
      default: localhost
security:
- BearerAuth: []
tags:
- name: System
  description: System information and health
- name: AI Runtime
  description: Model management and inference
- name: Event Bus
  description: Pub/sub event messaging
- name: Device Control
  description: Camera and device control
- name: App Manager
  description: Container application lifecycle
- name: Stream
  description: Video streaming
- name: Settings
  description: Dynamic system configuration (key-value store)
- name: Monitor
  description: System resource monitoring (CPU, memory, disk, network)
- name: Processes
  description: System process management
- name: Files
  description: Remote file management
- name: Terminal
  description: Web-based terminal access
- name: SSH
  description: SSH service configuration
- name: Logs
  description: System and service log viewing
- name: Storage
  description: Disk manipulation and hot-plug support
- name: Media
  description: Camera and media configuration
- name: Event Logs
  description: Event log management and querying
- name: Debug Logs
  description: Debug log export and service log access
- name: Network
  description: Network interface configuration (DHCP, static IP)
- name: Device Info
  description: Device information and naming
- name: Store
  description: Application store for discovering and installing apps
- name: Dev
  description: Application development workbench
- name: Containers
  description: Container management (containerd)
- name: Images
  description: Container image management
paths:
  /system/info:
    get:
      tags:
      - System
      summary: Get system information
      description: Returns platform version and service availability status
      operationId: getSystemInfo
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        version:
                          type: string
                          example: 0.1.0
                        services:
                          type: object
                          properties:
                            ai-runtime:
                              type: boolean
                            event-bus:
                              type: boolean
                            device-control:
                              type: boolean
                            app-manager:
                              type: boolean
  /system/stats:
    get:
      tags:
      - System
      summary: Get system statistics
      description: Returns real-time system and service statistics
      operationId: getSystemStats
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        timestamp:
                          type: integer
                          format: int64
                        services:
                          type: object
                          additionalProperties:
                            type: object
  /system/health:
    get:
      tags:
      - System
      summary: Health check
      description: Returns service health status (no authentication required)
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
                          example: healthy
                        time:
                          type: integer
                          format: int64
                        service:
                          type: string
                          example: platform-api
  /ai/models:
    get:
      tags:
      - AI Runtime
      summary: List all registered models
      operationId: listModels
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelListResponse'
        '503':
          description: AI Runtime not available
    post:
      tags:
      - AI Runtime
      summary: Register a new model
      description: Register a model by specifying its file path
      operationId: registerModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model_path
              properties:
                model_path:
                  type: string
                  description: Absolute path to model file
                  example: /data/aipc/models/yolov8n.hef
                model_id:
                  type: string
                  description: Optional model identifier
                  example: yolo_detection_v1
      responses:
        '200':
          description: Model registered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelRegisterResponse'
        '400':
          description: Invalid request
        '503':
          description: AI Runtime not available
  /ai/models/upload:
    post:
      tags:
      - AI Runtime
      summary: Upload and register a model file
      description: Upload a model file (HEF, ONNX, TFLite) and register it
      operationId: uploadModel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - model
              properties:
                model:
                  type: string
                  format: binary
                  description: Model file (.hef, .onnx, .bin, .tflite)
                model_id:
                  type: string
                  description: Optional model identifier
                model_type:
                  type: string
                  description: Optional model type (hef, onnx, tflite)
                variant:
                  type: string
                  description: Optional model variant
                threshold:
                  type: number
                  format: float
                  description: Optional detection threshold
                max_detections:
                  type: integer
                  description: Optional maximum detections
      responses:
        '200':
          description: Model uploaded and registered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        model_id:
                          type: string
                        model_path:
                          type: string
                        filename:
                          type: string
                        size:
                          type: integer
                        status:
                          type: object
                          description: Empty data
  /ai/models/{model_id}:
    get:
      tags:
      - AI Runtime
      summary: Get model information
      operationId: getModelInfo
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ModelInfo'
        '404':
          description: Model not found
    delete:
      tags:
      - AI Runtime
      summary: Unregister a model
      operationId: unregisterModel
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model unregistered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /ai/models/{model_id}/apps:
    get:
      tags:
      - AI Runtime
      summary: Get apps using a model
      description: Returns list of applications that are using this model
      operationId: getModelApps
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of apps using the model
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string
                      description: List of app IDs using this model
        '404':
          description: Model not found
  /ai/stats:
    get:
      tags:
      - AI Runtime
      summary: Get AI runtime statistics
      operationId: getAIStats
      responses:
        '200':
          description: AI statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SystemStats'
  /events/topics:
    get:
      tags:
      - Event Bus
      summary: List all event topics
      operationId: listTopics
      responses:
        '200':
          description: List of topics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        topics:
                          type: array
                          items:
                            $ref: '#/components/schemas/TopicInfo'
  /events/publish:
    post:
      tags:
      - Event Bus
      summary: Publish an event
      operationId: publishEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - topic
              properties:
                topic:
                  type: string
                  example: app/detection/result
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /events/stream:
    get:
      tags:
      - Event Bus
      summary: Subscribe to event stream (WebSocket)
      description: 'WebSocket endpoint for real-time event subscription.


        Connect with: `ws://{host}/api/v1/events/stream?token={jwt_token}`

        '
      operationId: eventStream
      responses:
        '101':
          description: Switching to WebSocket protocol
  /device/status:
    get:
      tags:
      - Device Control
      summary: Get device status
      operationId: getDeviceStatus
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DeviceStatus'
  /device/light:
    post:
      tags:
      - Device Control
      summary: Set white light level
      operationId: setLight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - level
              properties:
                level:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Light level (0-100)
      responses:
        '200':
          description: Light set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-led:
    post:
      tags:
      - Device Control
      summary: Control IR LED
      operationId: setIrLed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: boolean
                  description: Turn IR LED on/off
      responses:
        '200':
          description: IR LED set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ir-cut:
    post:
      tags:
      - Device Control
      summary: Set IR-CUT filter mode
      operationId: setIrCut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - auto
                  - day
                  - night
                  description: IR-CUT filter mode
      responses:
        '200':
          description: IR-CUT mode set
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/ptz:
    post:
      tags:
      - Device Control
      summary: Control PTZ (Pan/Tilt/Zoom)
      operationId: controlPTZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - pan
                  - tilt
                  - stop
                  - preset
                  - zoom
                  - focus
                direction:
                  type: string
                  enum:
                  - left
                  - right
                  - up
                  - down
                  - stop
                  description: Direction for pan/tilt
                speed:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Pan/tilt speed
                preset_id:
                  type: integer
                  minimum: 1
                  maximum: 255
                  description: Preset ID to call
                zoom_speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Zoom speed (negative=out, positive=in)
                focus_speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Focus speed (negative=near, positive=far)
      responses:
        '200':
          description: PTZ command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/zoom:
    post:
      tags:
      - Device Control
      summary: Control zoom
      operationId: controlZoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - speed
              properties:
                speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Zoom speed
      responses:
        '200':
          description: Zoom command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/focus:
    post:
      tags:
      - Device Control
      summary: Control focus
      operationId: controlFocus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - speed
              properties:
                speed:
                  type: integer
                  minimum: -100
                  maximum: 100
                  description: Focus speed
      responses:
        '200':
          description: Focus command executed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/autofocus:
    post:
      tags:
      - Device Control
      summary: Enable/disable autofocus
      operationId: setAutofocus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enable
              properties:
                enable:
                  type: boolean
      responses:
        '200':
          description: Autofocus setting updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/gpio:
    post:
      tags:
      - Device Control
      summary: Write GPIO value
      operationId: gpioWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pin
              - value
              properties:
                pin:
                  type: integer
                  description: GPIO pin number
                value:
                  type: boolean
                  description: Pin value (high/low)
      responses:
        '200':
          description: GPIO written
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /device/gpio/{pin}:
    get:
      tags:
      - Device Control
      summary: Read GPIO value
      operationId: gpioRead
      parameters:
      - name: pin
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: GPIO value
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        pin:
                          type: integer
                        value:
                          type: boolean
  /apps:
    get:
      tags:
      - App Manager
      summary: List all applications
      operationId: listApps
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppListResponse'
    post:
      tags:
      - App Manager
      summary: Install an application
      operationId: installApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - manifest_path
              properties:
                manifest_path:
                  type: string
                  description: Path to app.yaml manifest
                image_path:
                  type: string
                  description: Optional path to container image
      responses:
        '200':
          description: Application installed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/InstallResponse'
  /apps/{app_id}:
    get:
      tags:
      - App Manager
      summary: Get application info
      operationId: getApp
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application info
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppInfo'
    delete:
      tags:
      - App Manager
      summary: Uninstall application
      operationId: uninstallApp
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      - name: keep_logs
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Application uninstalled
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /apps/{app_id}/start:
    post:
      tags:
      - App Manager
      summary: Start an application
      operationId: startApp
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /apps/{app_id}/stop:
    post:
      tags:
      - App Manager
      summary: Stop an application
      operationId: stopApp
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      - name: timeout
        in: query
        schema:
          type: integer
          default: 30
        description: Stop timeout in seconds
      responses:
        '200':
          description: Application stopped
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data
  /apps/{app_id}/stats:
    get:
      tags:
      - App Manager
      summary: Get application statistics
      operationId: getAppStats
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppStats'
  /apps/{app_id}/logs:
    get:
      tags:
      - App Manager
      summary: Get application logs
      operationId: getAppLogs
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      - name: max_lines
        in: query
        schema:
          type: integer
          default: 100
      - name: follow
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Application logs
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string
  /apps/{app_id}/permissions:
    get:
      tags:
      - App Manager
      summary: Get app permissions
      description: Returns the permissions granted to an application
      operationId: getAppPermissions
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: App permissions
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppPermissions'
        '404':
          description: App not found
  /streams:
    get:
      tags:
      - Stream
      summary: List available streams
      operationId: listStreams
      responses:
        '200':
          description: List of streams
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StreamListResponse'
  /streams/{stream_id}:
    get:
      tags:
      - Stream
      summary: Get stream information
      operationId: getStreamInfo
      parameters:
      - name: stream_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StreamInfo'
  /h264/{stream_id}:
    get:
      tags:
      - Stream
      summary: Subscribe to H264 video stream (WebSocket)
      description: >
        WebSocket endpoint for zero-latency H264 video stream.
        Connect with: `ws://{host}/api/v1/h264/{stream_id}`
      operationId: h264Stream
      parameters:
      - name: stream_id
        in: path
        required: true
        schema:
          type: string
          example: main
      responses:
        '101':
          description: Switching to WebSocket protocol
  /settings:
    get:
      tags:
      - Settings
      summary: Get all settings
      operationId: getAllSettings
      responses:
        '200':
          description: All settings as key-value pairs
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        settings:
                          type: object
                          additionalProperties:
                            type: string
    post:
      tags:
      - Settings
      summary: Create or update a setting
      operationId: setSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                  example: detection_threshold
                value:
                  type: string
                  example: '0.75'
      responses:
        '200':
          description: Setting saved
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
  /settings/{key}:
    delete:
      tags:
      - Settings
      summary: Delete a setting
      operationId: deleteSetting
