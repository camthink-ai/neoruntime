      tags: [System]
      summary: Trigger a system restart
      operationId: restartSystem
      responses:
        '200':
          description: Restart initiated

  /system/ota/detect:
    get:
      tags: [System]
      summary: Check for new OTA firmware updates
      operationId: detectOTAUpdate
      responses:
        '200':
          description: Update availability status (always no update —
            updates are pushed locally, not polled from a remote server)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        update_available:
                          type: boolean
                        version:
                          type: string
                        changelog:
                          type: string

  /system/ota/install:
    post:
      tags: [System]
      summary: Upload and install a new firmware package
      description: Parses the package (advisory compatibility check), then
        deploys it. An incompatible package fails during validate with status
        failed — the parse endpoint reports the same verdict beforehand.
      operationId: installOTA
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        '200':
          description: OTA installation process started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                          example: OTA upgrade started
                        status:
                          type: string
                          example: started
                        progress:
                          type: string
                          description: URL to poll for progress
                          example: /api/v1/system/ota/status
                        job_id:
                          type: string

  # ==================== Login ====================
  /login:
    post:
      servers:
      - url: /api
        description: Login is registered at /api/login, outside the /api/v1
          group; relative so try-it-out hits the host serving this page
      tags: [System]
      summary: Authenticate and get API token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /logout:
    post:
      tags: [System]
      summary: Revoke the current API token
      description: Revokes the bearer token used for this request (server-side revocation).
      operationId: logout
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
  /auth/public-key:
    get:
      tags: [System]
      summary: Get the device RSA public key
      description: PEM public key used by clients to encrypt password payloads for login.
      operationId: getPublicKey
      responses:
        '200':
          description: Public key material
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        public_key:
                          type: string
                          description: PEM-encoded RSA public key
                        algorithm:
                          type: string
                          example: RSA-2048/PKCS1v15
                        unix_timestamp:
                          type: integer
                          format: int64

  # ==================== OTA Extended ====================
  /system/ota/status:
    get:
      tags: [System]
      summary: Get OTA upgrade status
      operationId: getOTAStatus
      responses:
        '200':
          description: OTA status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OTAStatusResponse'

  /system/ota/parse:
    post:
      tags: [System]
      summary: Parse firmware file without installing
      description: Upload a firmware file and inspect version info
      operationId: parseOTAFirmware
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [firmware]
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        '200':
          description: Firmware metadata
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OTAParseResponse'

  /system/ota/install-from-path:
    post:
      tags: [System]
      summary: Install OTA firmware from local path
      operationId: installOTAFromPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTAInstallFromPathRequest'
      responses:
        '200':
          description: OTA upgrade started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        status:
                          type: string
                        progress:
                          type: string
                          description: URL to poll for progress
                          example: /api/v1/system/ota/status
                        source_path:
                          type: string
                        job_id:
                          type: string

  # ==================== OS A/B Upgrade ====================
  /system/os-upgrade/upload:
    post:
      tags: [System]
      summary: Stream an SWUpdate OS package to persistent storage
      operationId: uploadOSUpgrade
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
      responses:
        '200':
          description: Package uploaded; returns the created job
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OSUpgradeJob'

  /system/os-upgrade/validate:
    post:
      tags: [System]
      summary: Validate an uploaded OS package
      operationId: validateOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Package validation result; compatibility_valid /
            compatibility_warning judge the installed app against the target OS
            (advisory)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OSUpgradeJob'

  /system/os-upgrade/install:
    post:
      tags: [System]
      summary: Start writing the inactive OS copy
      operationId: installOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Independent updater service started; returns the job
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OSUpgradeJob'

  /system/os-upgrade/status:
    get:
      tags: [System]
      summary: Get the persistent OS upgrade status and log tail
      operationId: getOSUpgradeStatus
      parameters:
      - in: query
        name: job_id
        schema:
          type: string
      responses:
        '200':
          description: Current OS upgrade status (job with log tail; bare
            idle status when no job exists)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      anyOf:
                      - $ref: '#/components/schemas/OSUpgradeJob'
                      - type: object
                        properties:
                          status:
                            type: string
                            example: idle

  /system/os-upgrade/reboot:
    post:
      tags: [System]
      summary: Reboot into the newly installed OS copy
      operationId: rebootOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Reboot service started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        job_id:
                          type: string
                        status:
                          type: string
                          example: rebooting

  /system/os-upgrade/cancel:
    post:
      tags: [System]
      summary: Cancel a job before installation
      operationId: cancelOSUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Job cancelled; returns the updated job
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OSUpgradeJob'

  /system/os-upgrade/package:
    delete:
      tags: [System]
      summary: Delete a stored OS upgrade package
      operationId: deleteOSUpgradePackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OSUpgradeJobRequest'
      responses:
        '200':
          description: Package deleted

  # ==================== System Time ====================
  /system/time/sync-from-client:
    post:
      tags: [System]
      summary: Sync device clock from client timestamp
      description: Sets the device clock using the client's Unix-epoch seconds; compensates
        for request transit latency where measurable.
      operationId: syncTimeFromClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncFromClientRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /system/time:
    get:
      tags: [System]
      summary: Get current system time
      operationId: getSystemTime
      responses:
        '200':
          description: Current system time
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        timezone:
                          type: string
                        uptime:
                          type: integer
                          format: int64

  /system/time/set:
    post:
      tags: [System]
      summary: Set system time manually
      operationId: setSystemTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeRequest'
      responses:
        '200':
          description: Time set successfully

  /system/time/config:
    get:
      tags: [System]
      summary: Get time configuration (NTP settings)
      operationId: getTimeConfig
      responses:
        '200':
          description: Time configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TimeConfig'
    put:
      tags: [System]
      summary: Save time configuration (timezone)
      description: Persists the timezone into the device time configuration.
      operationId: saveTimeConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTimeConfigRequest'
      responses:
        '200':
          description: Time configuration saved
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: Empty data

  /system/time/timezone:
    put:
      tags: [System]
      summary: Set timezone
      operationId: setTimezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimezoneRequest'
      responses:
        '200':
          description: Timezone updated

  /system/time/ntp:
    put:
      tags: [System]
      summary: Configure NTP settings
      operationId: setNTPConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NTPConfigRequest'
      responses:
        '200':
          description: NTP configuration updated

  /system/time/ntp/sync:
    post:
      tags: [System]
      summary: Trigger NTP time synchronization
      operationId: syncNTP
      responses:
        '200':
          description: NTP sync triggered

  /system/time/timezones:
    get:
      tags: [System]
      summary: List available timezones
      operationId: getTimezones
      responses:
        '200':
          description: Timezone list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string

  /system/clone/export:
    get:
      tags: [System]
      summary: Export device configuration bundle
      description: Streams a self-describing tar.gz carrying the /data/aipc/etc tree plus
        the four config-Controller DB tables. Identity fields (token key, password, certs,
        device name, auth/device_info rows) are never packed; apps and models stay on the
        target device.
      operationId: exportDeviceConfig
      responses:
        '200':
          description: Clone bundle (application/gzip attachment)
          content:
            application/gzip:
              schema:
                type: string
                format: binary
  /system/clone/import:
    post:
      tags: [System]
      summary: Import device configuration bundle
      description: Applies a bundle produced by /system/clone/export onto a same-model
        device, then restarts affected services.
      operationId: importDeviceConfig
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Clone bundle (.tar.gz / .tgz)
      responses:
        '200':
          description: Import result summary
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /config/jobs:
    get:
      tags: [System]
      summary: List config-controller apply jobs
      description: Read-only audit of config apply/delete/reconcile job history.
      operationId: listConfigJobs
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          type: string
        description: Filter by config domain
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Max jobs to return
      responses:
        '200':
          description: Config job list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        jobs:
                          type: array
                          items:
                            type: object
                        count:
                          type: integer
  /config/jobs/{id}:
    get:
      tags: [System]
      summary: Get one config job by ID
      operationId: getConfigJob
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Config job
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        job:
                          type: object
        '404':
          description: Job not found

  # ==================== Event Logs ====================
  /event-logs:
    get:
      tags: [Event Logs]
      summary: List event logs
      description: Query event logs with filtering and pagination
      operationId: listEventLogs
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Event log entries
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        total:
                          type: integer
                          format: int64
                        limit:
                          type: integer
                        offset:
                          type: integer
                        entries:
                          type: array
                          items:
                            $ref: '#/components/schemas/EventLog'
    post:
      tags: [Event Logs]
      summary: Create an event log entry
      operationId: createEventLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventLogCreateRequest'
      responses:
        '200':
          description: Event log created
    delete:
      tags: [Event Logs]
      summary: Cleanup old event logs
      operationId: cleanupEventLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Number of days to retain
      responses:
        '200':
          description: Cleanup result

  /event-logs/statistics:
    get:
      tags: [Event Logs]
      summary: Get event log statistics
      operationId: getEventLogStatistics
      responses:
        '200':
          description: Event log statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true
  /event-logs/templates:
    get:
      tags: [Event Logs]
      summary: Get event message templates
      description: All event codes with their localized (en/zh) message templates,
        module, level and declared parameters.
      operationId: getEventLogTemplates
      responses:
        '200':
          description: Event templates keyed by code
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        templates:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              en:
                                type: string
                              zh:
                                type: string
                              module:
                                type: string
                              level:
                                type: string
                              params:
                                type: array
                                items:
                                  type: string

  # ==================== Debug Logs ====================
  /debug-logs/export:
    post:
      tags: [Debug Logs]
      summary: Export debug logs as tar.gz
      operationId: exportDebugLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugLogExportRequest'
      responses:
        '200':
          description: tar.gz archive of debug logs
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /debug-logs/services:
    get:
      tags: [Debug Logs]
      summary: List available systemd services for log export
      operationId: getDebugLogServices
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string

  /debug-logs/files:
    get:
      tags: [Debug Logs]
      summary: List available log files
      operationId: getDebugLogFiles
      responses:
        '200':
          description: Log file list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                          name:
                            type: string
                          size:
                            type: integer
                            format: int64
                          modified_time:
                            type: string

  # ==================== App Manager Extended ====================
  /apps/{app_id}/restart:
    post:
      tags: [App Manager]
      summary: Restart an application
      operationId: restartApp
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # ==================== Network ====================
  /network/config:
    get:
      tags: [Network]
      summary: Get network configuration
      operationId: getNetworkConfig
      responses:
        '200':
          description: Network configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NetworkConfig'
    post:
      tags: [Network]
      summary: Update network configuration
      description: Switch between DHCP and static IP mode. Changing network config may cause temporary connectivity loss.
      operationId: updateNetworkConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
      responses:
        '200':
          description: Network configuration updated

  /network/interfaces:
    get:
      tags: [Network]
      summary: List all network interfaces
      operationId: getNetworkInterfaces
      responses:
        '200':
          description: Network interfaces
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        interfaces:
                          type: array
                          items:
                            $ref: '#/components/schemas/NetworkInterfaceInfo'

  # ==================== Device Info ====================
  /device-info:
    get:
      tags: [Device Info]
      summary: Get device information
      operationId: getDeviceInfo
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DeviceInfo'
    put:
      tags: [Device Info]
      summary: Update device name
      operationId: updateDeviceName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: Alphanumeric, underscore, hyphen only
      responses:
        '200':
          description: Device name updated
  /device-info/factory:
    get:
      tags: [Device Info]
      summary: Get factory information
      description: Read-only factory-programmed fields (batch, line, calibration date, ...).
      operationId: getFactoryInfo
      responses:
        '200':
          description: Factory information
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true
    post:
      tags: [Device Info]
      summary: Write one factory field
      description: Writes a single factory-programmed field (write-once semantics;
        intended for the production line).
      operationId: updateFactoryField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value]
              properties:
                field:
                  type: string
                value:
                  type: string
      responses:
        '200':
          description: Factory field written
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object

  # ==================== Media Extended ====================
  /media/image:
    get:
      tags: [Media]
      summary: Get current ISP image parameters
      operationId: getImageConfig
      responses:
        '200':
          description: ISP image parameters
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MediaImageConfig'
    put:
      tags: [Media]
      summary: Update ISP image parameters
      operationId: updateImageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaImageConfig'
      responses:
        '200':
          description: Image parameters updated

  /media/encoder:
    put:
      tags: [Media]
      summary: Update encoder parameters for a stream
      operationId: updateEncoderConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaEncoderConfig'
      responses:
        '200':
          description: Encoder parameters updated

  /media/rtsp:
    put:
      tags: [Media]
      summary: Enable or disable RTSP server
      operationId: setRtspEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: RTSP state updated

  /media/ai-overlay:
    put:
      tags: [Media]
      summary: Update AI overlay configuration
      operationId: updateAiOverlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAiOverlayConfig'
      responses:
        '200':
          description: AI overlay updated

  /media/osd:
    get:
      tags: [Media]
      summary: Get OSD (On-Screen Display) configuration
      operationId: getOsdConfig
      responses:
        '200':
          description: OSD configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MediaOsdConfig'
    put:
      tags: [Media]
      summary: Update OSD (On-Screen Display) configuration
      operationId: updateOsdConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaOsdConfig'
      responses:
        '200':
          description: OSD configuration updated

  /media/encoder/reconfig:
    put:
      tags: [Media]
      summary: Reconfigure encoder (full reinit)
      description: Fully reconfigure encoder parameters. Causes brief stream interruption.
      operationId: reconfigureEncoder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaReconfigRequest'
      responses:
        '200':
          description: Encoder reconfigured
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        interrupt_ms:
                          type: integer

  /media/transform:
    get:
      tags: [Media]
      summary: Get transform configuration
      operationId: getTransformConfig
      responses:
        '200':
          description: Transform configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MediaTransformConfig'
    put:
      tags: [Media]
      summary: Update transform configuration
      description: Partial update — rotation (0/90/180/270), flip, dewarp, grayscale,
        DIS and EIS.
      operationId: updateTransformConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaTransformConfig'
      responses:
        '200':
          description: Transform configuration updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MediaTransformConfig'
  /media/config/bundle:
    get:
      tags: [Media]
      summary: Export full media config bundle
      description: Streams a versioned tar.gz aggregating the base YAML, the seven runtime
        JSON configs and the OSD overlay image binaries referenced by osd_config.json.
      operationId: exportMediaBundle
      responses:
        '200':
          description: Media config bundle (application/gzip attachment)
          content:
            application/gzip:
              schema:
                type: string
                format: binary
  /media/config/import-bundle:
    post:
      tags: [Media]
      summary: Import a media config bundle
      description: Applies a bundle from /media/config/bundle — every member is verified
        before any write; camera-daemon and device-control restart afterwards.
      operationId: importMediaBundle
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Media bundle (.tar.gz / .tgz)
      responses:
        '200':
          description: Import result summary
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /media/osd/upload-image:
    post:
      tags: [Media]
      summary: Upload an OSD overlay image
      description: PNG or BMP only; stored under /data/aipc/etc/osd and referenced by
        image overlays via image_path.
      operationId: uploadOsdImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG or BMP image
      responses:
        '200':
          description: Image stored
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        path:
                          type: string
                        size:
                          type: integer
                          format: int64
  /media/osd/font:
    get:
      tags: [Media]
      summary: Download the OSD font file
      operationId: getOsdFont
      responses:
        '200':
          description: TTF font file (cacheable, max-age 86400)
          content:
            font/ttf:
              schema:
                type: string
                format: binary
  /media/osd/image/{name}:
    get:
      tags: [Media]
      summary: Serve a stored OSD overlay image
      operationId: getOsdImage
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Image filename under /data/aipc/etc/osd
      responses:
        '200':
          description: Image binary
          content:
            image/*:
              schema:
                type: string
                format: binary
  /media/privacy-mask:
    get:
      tags: [Media]
      summary: Get privacy mask configuration
      operationId: getPrivacyMaskConfig
      responses:
        '200':
          description: Privacy mask configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PrivacyMaskConfig'
    put:
      tags: [Media]
      summary: Update privacy mask configuration
      description: Partial update; region points accept both snake_case and camelCase
        point arrays (points_x / pointsX).
      operationId: updatePrivacyMaskConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyMaskConfig'
      responses:
        '200':
          description: Privacy mask configuration updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PrivacyMaskConfig'
  /media/profile:
    get:
      tags: [Media]
      summary: Get the active pipeline profile name
      operationId: getMediaProfile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        profile_name:
                          type: string
  /media/profiles:
    get:
      tags: [Media]
      summary: List available pipeline profiles
      operationId: listMediaProfiles
      responses:
        '200':
          description: Profile list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        profiles:
                          type: array
                          items:
                            type: string
                        current_profile:
                          type: string
  /media/profile/switch:
    post:
      tags: [Media]
      summary: Switch the active pipeline profile
      description: Hot profile switch — returns the accepted flag and expected stream
        interrupt duration.
      operationId: switchMediaProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_name]
              properties:
                profile_name:
                  type: string
      responses:
        '200':
          description: Switch result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        success:
                          type: boolean
                        message:
                          type: string
                        interrupt_ms:
                          type: integer
  /media/profile/backup:
    post:
      tags: [Media]
      summary: Back up the active pipeline profile
      operationId: backupMediaProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Destination path for the profile backup
      responses:
        '200':
          description: Backup result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        success:
                          type: boolean
                        message:
                          type: string
  /media/pipeline/reconfigure:
    post:
      tags: [Media]
      summary: Reconfigure the full pipeline
      description: Sends 1-4 stream definitions (input geometry + encoder settings);
        camera-daemon rebuilds the pipeline.
      operationId: reconfigurePipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [streams]
              properties:
                streams:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: object
                    required: [input_width, input_height, input_framerate]
                    properties:
                      stream_id:
                        type: string
                        description: Defaults to sinkN when omitted
                      input_width:
                        type: integer
                      input_height:
                        type: integer
                      input_framerate:
                        type: integer
                      codec:
                        type: string
                      encoder_width:
                        type: integer
                      encoder_height:
                        type: integer
                      encoder_framerate:
                        type: integer
                      encoder_bitrate:
                        type: integer
                      encoder_gop:
                        type: integer
      responses:
        '200':
          description: Pipeline reconfiguration result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /media/status:
    get:
      tags: [Media]
      summary: Get live status of all streams
      description: Merges camera-daemon live encoder state with the configured stream
        table; disabled streams appear with status "inactive".
      operationId: getMediaStreamStatus
      responses:
        '200':
          description: Stream status list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StreamStatusList'
  /media/streams:
    get:
      tags: [Media]
      summary: List configured streams
      description: Read-only stream inventory as parsed from camera-daemon.yaml
        (kept in sync after config writes). For runtime encoder state use
        GET /media/status instead. Each entry carries playback URLs
        rtsp_url (RTSP mount) and h264_ws_path (H264-over-WebSocket route;
        prefix with the API base and swap http to ws).
      operationId: listStreams
      responses:
        '200':
          description: Stream inventory
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        streams:
                          type: array
                          items:
                            $ref: '#/components/schemas/StreamView'
    post:
      tags: [Media]
      summary: Add a stream
      description: Adds an encoder stream at runtime (stream_id, geometry, fps, codec,
        bitrate, gop). Codec defaults to h264.
      operationId: addStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_id, width, height, fps]
              properties:
                stream_id:
                  type: string
                width:
                  type: integer
                height:
                  type: integer
                fps:
                  type: integer
                codec:
                  type: string
                  default: h264
                bitrate:
                  type: integer
                gop:
                  type: integer
      responses:
        '200':
          description: Stream added
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /media/streams/{name}:
    get:
      tags: [Media]
      summary: Get a stream's configuration
      description: Single stream from the config-view inventory, including its
        playback URLs (rtsp_url, h264_ws_path).
      operationId: getStream
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream configuration
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StreamView'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
    delete:
      tags: [Media]
      summary: Remove a stream
      description: The main stream cannot be removed.
      operationId: removeStream
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream removed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /media/streams/{name}/enable:
    post:
      tags: [Media]
      summary: Enable a stream
      description: Pipeline-level enable via ReconfigurePipeline; the main stream is
        always enabled.
      operationId: enableStream
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream enable result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
  /media/streams/{name}/disable:
    delete:
      tags: [Media]
      summary: Disable a stream
      description: Pipeline-level disable via ReconfigurePipeline; the main stream
        cannot be disabled.
      operationId: disableStream
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream disable result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object

  # ==================== Audio ====================
  /audio/capture-devices:
    get:
      tags: [Media]
      summary: List audio capture devices
      operationId: listCaptureDevices
      responses:
        '200':
          description: Capture device list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        devices:
                          type: array
                          items:
                            type: object
  /audio/playback-devices:
    get:
      tags: [Media]
      summary: List audio playback devices
      operationId: listPlaybackDevices
      responses:
        '200':
          description: Playback device list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        devices:
                          type: array
                          items:
                            type: object
  /audio/status:
    get:
      tags: [Media]
      summary: Get audio pipeline status
      operationId: getAudioStatus
      responses:
        '200':
          description: Audio status
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AudioStatus'
  /audio/capture/start:
    post:
      tags: [Media]
      summary: Start audio capture
      operationId: startAudioCapture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioConfigRequest'
      responses:
        '200':
          description: Capture started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
  /audio/capture/stop:
    post:
      tags: [Media]
      summary: Stop audio capture
      operationId: stopAudioCapture
      responses:
        '200':
          description: Capture stopped
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
  /audio/config:
    put:
      tags: [Media]
      summary: Update audio configuration
      description: Persists audio config to camera-daemon.yaml (device, sample rate,
        channels, codec, bitrate, volume, mute, playback_enabled).
      operationId: setAudioConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioConfigRequest'
      responses:
        '200':
          description: Audio config updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
  /audio/playback/start:
    post:
      tags: [Media]
      summary: Start audio playback
      operationId: startAudioPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioConfigRequest'
      responses:
        '200':
          description: Playback started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
  /audio/playback/stop:
    post:
      tags: [Media]
      summary: Stop audio playback
      operationId: stopAudioPlayback
      responses:
        '200':
          description: Playback stopped
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
  /audio/stream:
    get:
      tags: [Media]
      summary: Audio capture stream (WebSocket)
      description: WebSocket carrying captured audio frames from device to browser.
      operationId: audioStreamWS
      responses:
        '101':
          description: WebSocket upgrade
  /audio/talk:
    get:
      tags: [Media]
      summary: Two-way talk (WebSocket)
      description: Push-to-talk — browser microphone PCM pushed to the device speaker.
      operationId: audioTalkWS
      responses:
        '101':
          description: WebSocket upgrade

  # ==================== Files Extended ====================
  /files/batch-download:
    post:
      tags: [Files]
      summary: Batch download files as ZIP
      operationId: batchDownloadFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBatchRequest'
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /files/batch-delete:
    post:
      tags: [Files]
      summary: Batch delete files
      operationId: batchDeleteFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBatchRequest'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: array
                          items:
                            type: string
                        count:
                          type: integer
                        failed:
                          type: array
                          items:
                            type: object
                        failed_count:
                          type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
  schemas:
    APIResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: Success
        data:
          type: object
          description: Response payload
        error:
          $ref: '#/components/schemas/ErrorDetail'
    TensorSpec:
      type: object
      properties:
        name:
          type: string
        shape:
          type: array
          items:
            type: integer
        dtype:
          type: string
          enum:
          - UINT8
          - INT8
          - UINT16
          - INT16
          - FLOAT16
          - FLOAT32
          - INT32
          - UINT32
    ModelInfo:
      type: object
      properties:
        model_id:
          type: string
        model_path:
          type: string
        version:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TensorSpec'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/TensorSpec'
        estimated_tops:
          type: number
        estimated_memory:
          type: integer
        load_timestamp:
          type: integer
          format: int64
    ModelListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
    ModelRegisterResponse:
      type: object
      properties:
        model_id:
          type: string
        status:
          type: object
          description: Empty data
    InferenceStats:
      type: object
      properties:
        model_id:
          type: string
        total_inferences:
          type: integer
          format: int64
        total_errors:
          type: integer
          format: int64
        avg_latency_us:
          type: integer
          format: int64
        current_qps:
          type: number
        queue_depth:
          type: integer
    SystemStats:
      type: object
      properties:
        model_stats:
          type: array
          items:
            $ref: '#/components/schemas/InferenceStats'
        device_utilization:
          type: number
        device_temperature:
          type: number
        total_memory_bytes:
          type: integer
          format: int64
        used_memory_bytes:
          type: integer
          format: int64
    TopicInfo:
      type: object
      properties:
        name:
          type: string
        subscriber_count:
          type: integer
    DeviceStatus:
      type: object
      properties:
        white_light_level:
          type: integer
        ir_led_on:
          type: boolean
        ircut_mode:
          type: integer
        soc_temp_c:
          type: number
        mcu_temp_c:
          type: number
        light_sensor:
          type: integer
        ptz_pan_pos:
          type: number
        ptz_tilt_pos:
          type: number
